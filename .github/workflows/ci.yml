name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v5
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ hashFiles('.ruby-version', '.rubocop.yml', 'Gemfile.lock') }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ hashFiles('.ruby-version', '.rubocop.yml', 'Gemfile.lock') }}-

      - name: Lint Ruby
        run: bundle exec rubocop --format github

  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # eslint is not in this phase. npm test, build, check:version, and check:dist are the JS gates.
    defaults:
      run:
        working-directory: sdk

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/package-lock.json

      - name: Install SDK dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build dist
        run: npm run build

      - name: Check version alignment
        run: npm run check:version

      - name: Inspect dist artifacts
        run: npm run check:dist

      - name: Fail when committed dist drifts
        working-directory: ${{ github.workspace }}
        run: git diff --exit-code -- dist test/dummy/public/sdk

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recording_studio_plugin_sdk_template_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        ruby-version: ["3.3", "3.4"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
          cache-version: ${{ hashFiles('test/dummy/Gemfile.lock') }}

      - name: Install dummy app dependencies
        run: bundle install
        working-directory: test/dummy
        env:
          BUNDLE_GITHUB__COM: x-access-token:${{ secrets.BOWERBIRD_ORG_CI_TOKEN }}

      - name: Build dummy app Tailwind assets
        run: bundle exec rails tailwindcss:build
        working-directory: test/dummy

      - name: Run tests
        run: bundle exec rake test:all
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/recording_studio_plugin_sdk_template_test
